[package]
name = "backroom-desktop"
version = "0.0.1"
description = "Backroom desktop app"
edition = "2021"
publish = false

[lib]
name = "backroom_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
url = "=2.5.8"

[dependencies]
base64 = "=0.23.1"
rand = "=0.10.3"
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-notification = "=2.8.1"
tauri-plugin-opener = "=2.7.3"
tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }
# Blocking HTTP client for the setup page's `/health` check only: rustls with
# ring, verifying against the OS trust store through rustls-platform-verifier
# (like the webview; no OpenSSL, no async runtime).
ureq = { version = "=3.5.0", default-features = false, features = ["rustls", "platform-verifier"] }
# Same rustls ureq uses (no new crate): only to tell certificate errors apart.
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring"] }
url = "=2.5.8"

# Same version and (default) features as the zbus the opener, notification and
# single-instance plugins already pull in; used only for the tray-host probe.
# Already in the tree (same version); only for O_NOFOLLOW / O_NONBLOCK when
# reading server.json.
[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "=5.19.0"

[dev-dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "test"] }

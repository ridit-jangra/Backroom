[package]
name = "backroom-desktop"
version = "0.1.0"
description = "Backroom desktop app"
edition = "2021"
publish = false

[lib]
name = "backroom_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
url = "=2.5.8"

[dependencies]
base64 = "=0.23.1"
rand = "=0.10.3"
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-notification = "=2.8.1"
tauri-plugin-opener = "=2.7.3"
tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }
url = "=2.5.8"

[dev-dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "test"] }

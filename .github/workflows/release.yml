name: Release

# Builds the desktop app for Linux, Windows and macOS and, for a pushed version tag only,
# creates a DRAFT GitHub Release with the installers and SHA256SUMS. Nothing is published:
# a maintainer reviews the draft and publishes it by hand (docs/RELEASING.md).
#
# Manual runs (workflow_dispatch) only build: the bundles land in the run's artifacts and no
# release is created, whatever `dry_run` says. No secrets are used; the release job gets the
# automatic GITHUB_TOKEN with contents: write, every other job is read-only.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build only and keep the bundles as workflow artifacts (manual runs never create a release)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # The event is part of the group, so a manual run on a tag ref can never cancel (or queue
  # behind) the tag push's release run. Tag runs are never cancelled.
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

defaults:
  run:
    shell: bash

# Caches: tag builds (event `push`) restore no cache at all, so nothing another run wrote into
# target/ or ~/.cargo can end up in a released installer, and setup-node's npm cache is not used
# in any build job. Manual dry runs may restore the Rust cache, and only runs on main save it.

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      # Full history, so the tagged commit can be checked against origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # A tag must point at a commit on main and match the version in package.json,
      # tauri.conf.json, Cargo.toml, Cargo.lock and package-lock.json (set by
      # scripts/set-version.mjs), so a mis-tagged commit fails here before anything is built.
      # Manual runs use the version the files carry, from any branch.
      - id: version
        name: Derive and check the version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ]; then
            if [ "$REF_TYPE" != tag ]; then
              echo "::error::release builds run only for tags"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::the tagged commit is not on main; tag a commit of main"
              exit 1
            fi
            version="${REF_NAME#v}"
          else
            version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
            echo "Manual run (dry_run=${DRY_RUN}): building ${version}; no release will be created."
          fi
          # Validates the version syntax and limits first, then compares every file with it.
          node scripts/set-version.mjs "$version" --check
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

  # Each build job copies exactly its expected installers into release-assets/ (failing when one
  # is missing), records their SHA-256 in hashes/<job>.sha256 and uploads both. The release job
  # compares those hashes with what it downloaded. The names are listed in docs/RELEASING.md.
  # Pre-releases (a `-` in the version) skip the RPM (RPM versions may not contain `-`) and the
  # MSI (WiX accepts only a numeric pre-release); see docs/RELEASING.md.
  linux:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Same packages as ci.yml plus `file` for linuxdeploy. The RPM is written by the Tauri CLI
      # itself (no rpmbuild), and the CLI runs linuxdeploy with APPIMAGE_EXTRACT_AND_RUN=1, so
      # neither `rpm` nor FUSE is needed.
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev file

      # Pinned to a master commit: the `stable` branch is rebuilt on every master update, so an
      # old `stable` SHA is not reachable from any branch.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16 (Add 1.99.1 patch release)
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: github.event_name != 'push'
        with:
          workspaces: apps/desktop/src-tauri
          key: release-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Only the desktop workspace's dependencies (the Tauri CLI), without install scripts.
      - run: npm ci --workspace apps/desktop --include-workspace-root=false --ignore-scripts

      - name: Build deb, rpm and AppImage
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = true ]; then
            npx tauri build --ci --bundles deb,appimage
          else
            npx tauri build --ci
          fi

      - name: Collect the installers
        run: |
          set -euo pipefail
          bundle=apps/desktop/src-tauri/target/release/bundle
          expected=("deb/Backroom_${VERSION}_amd64.deb" "appimage/Backroom_${VERSION}_amd64.AppImage")
          if [ "$PRERELEASE" != true ]; then
            expected+=("rpm/Backroom-${VERSION}-1.x86_64.rpm")
          fi
          mkdir release-assets hashes
          for f in "${expected[@]}"; do
            test -f "$bundle/$f" || { echo "::error::missing $bundle/$f"; ls -R "$bundle" || true; exit 1; }
            cp "$bundle/$f" release-assets/
          done
          (cd release-assets && sha256sum -- *) > hashes/linux.sha256
          cat hashes/linux.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backroom-linux
          path: |
            release-assets/
            hashes/
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16 (Add 1.99.1 patch release)
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: github.event_name != 'push'
        with:
          workspaces: apps/desktop/src-tauri
          key: release-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci --workspace apps/desktop --include-workspace-root=false --ignore-scripts

      # The Tauri CLI downloads NSIS and WiX itself. Unsigned (no signing secrets exist).
      - name: Build the NSIS installer and the MSI
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = true ]; then
            npx tauri build --ci --bundles nsis
          else
            npx tauri build --ci
          fi

      - name: Collect the installers
        run: |
          set -euo pipefail
          bundle=apps/desktop/src-tauri/target/release/bundle
          expected=("nsis/Backroom_${VERSION}_x64-setup.exe")
          if [ "$PRERELEASE" != true ]; then
            expected+=("msi/Backroom_${VERSION}_x64_en-US.msi")
          fi
          mkdir release-assets hashes
          for f in "${expected[@]}"; do
            test -f "$bundle/$f" || { echo "::error::missing $bundle/$f"; ls -R "$bundle" || true; exit 1; }
            cp "$bundle/$f" release-assets/
          done
          (cd release-assets && sha256sum -- *) > hashes/windows.sha256
          cat hashes/windows.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backroom-windows
          path: |
            release-assets/
            hashes/
          if-no-files-found: error
          retention-days: 14

  macos:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Both macOS targets, for the universal build.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16 (Add 1.99.1 patch release)
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: github.event_name != 'push'
        with:
          workspaces: apps/desktop/src-tauri
          key: release-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci --workspace apps/desktop --include-workspace-root=false --ignore-scripts

      # One universal (arm64 + x86_64) app and dmg, ad-hoc signed (signingIdentity "-" in
      # tauri.macos.conf.json; no certificate, not notarized).
      - name: Build the universal app and dmg
        working-directory: apps/desktop
        run: npx tauri build --ci --target universal-apple-darwin

      - name: Collect the installers
        run: |
          set -euo pipefail
          bundle=apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          expected=("dmg/Backroom_${VERSION}_universal.dmg")
          mkdir release-assets hashes
          for f in "${expected[@]}"; do
            test -f "$bundle/$f" || { echo "::error::missing $bundle/$f"; ls -R "$bundle" || true; exit 1; }
            cp "$bundle/$f" release-assets/
          done
          (cd release-assets && shasum -a 256 -- *) > hashes/macos.sha256
          cat hashes/macos.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backroom-macos
          path: |
            release-assets/
            hashes/
          if-no-files-found: error
          retention-days: 14

  # Arch Linux package: packaging/aur/backroom-bin/PKGBUILD built in an Arch container from the
  # deb the linux job just built (a local source with its checksum computed here: the release
  # URL the PKGBUILD normally points at does not exist yet). The .pkg.tar.zst becomes a release
  # asset so `pacman -U` works. Skipped for pre-releases: pacman versions cannot contain `-`, and
  # the manifests in packaging/ only target stable releases.
  # The image is pinned by digest (archlinux:base-devel-20261025.0.616225, 19 days old when
  # pinned); `pacman -Syu` then brings it up to date, as Arch supports no partial upgrades.
  # makepkg refuses to run as root, so the build runs as an unprivileged `builder` user.
  arch:
    needs: [version, linux]
    if: needs.version.outputs.prerelease != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: archlinux:base-devel-20261025.0.616225@sha256:624bdc7fc6615155d67bc34cf7146c0c9fd0e3c92943977da63a630e4ca49c30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # The keyring first: an image that is months old may not know the packagers' current keys.
      - name: Update the system and install git and namcap
        run: |
          set -euo pipefail
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Su --noconfirm
          pacman -S --noconfirm --needed git namcap

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backroom-linux
          path: linux-artifact

      # The PKGBUILD copy differs from the committed one only in pkgver, pkgrel (1) and the two
      # sha256sums; the sources are the files the PKGBUILD names, placed next to it, so makepkg
      # finds them and downloads nothing.
      - name: Prepare the backroom-bin build directory
        run: |
          set -euo pipefail
          deb="Backroom_${VERSION}_amd64.deb"
          # The deb must be the one the linux job hashed right after building it.
          (cd linux-artifact/release-assets && grep -E "^[0-9a-f]{64}  ${deb//./\\.}\$" ../hashes/linux.sha256 | sha256sum -c -)
          build=/tmp/aur-build
          mkdir -p "$build"
          cp "linux-artifact/release-assets/$deb" "$build/"
          cp LICENSE "$build/backroom-LICENSE-${VERSION}"
          deb_sha="$(sha256sum "$build/$deb" | cut -d' ' -f1)"
          lic_sha="$(sha256sum "$build/backroom-LICENSE-${VERSION}" | cut -d' ' -f1)"
          sed -e "s/^pkgver=.*/pkgver=${VERSION}/" -e 's/^pkgrel=.*/pkgrel=1/' packaging/aur/backroom-bin/PKGBUILD \
            | awk -v a="$deb_sha" -v b="$lic_sha" '
                /^sha256sums=\(/ { skip = 1; print "sha256sums=(\047" a "\047"; print "            \047" b "\047)" }
                skip && /\)$/ { skip = 0; next }
                !skip { print }' > "$build/PKGBUILD"
          diff packaging/aur/backroom-bin/PKGBUILD "$build/PKGBUILD" || true
          useradd --create-home builder
          chown -R builder: "$build"

      - name: Install the runtime dependencies
        working-directory: /tmp/aur-build
        run: |
          set -euo pipefail
          mapfile -t deps < <(runuser -u builder -- makepkg --printsrcinfo | sed -n 's/^\tdepends = //p')
          pacman -S --noconfirm --needed "${deps[@]}"

      - name: Build backroom-bin
        working-directory: /tmp/aur-build
        run: runuser -u builder -- makepkg --noconfirm

      # namcap warnings are printed for review; an error (E:) fails the job. Expect a warning
      # that libayatana-appindicator is not needed: the binary loads it with dlopen.
      - name: namcap
        working-directory: /tmp/aur-build
        run: |
          set -euo pipefail
          pkg="backroom-bin-${VERSION}-1-x86_64.pkg.tar.zst"
          test -f "$pkg" || { echo "::error::makepkg did not produce $pkg"; ls -l; exit 1; }
          out="$(namcap PKGBUILD "$GITHUB_WORKSPACE/packaging/aur/backroom/PKGBUILD" "$pkg" 2>&1)"
          echo "$out"
          if grep -q ' E: ' <<< "$out"; then
            echo "::error::namcap reported errors"
            exit 1
          fi

      - name: Collect the package
        run: |
          set -euo pipefail
          pkg="backroom-bin-${VERSION}-1-x86_64.pkg.tar.zst"
          mkdir release-assets hashes
          cp "/tmp/aur-build/$pkg" release-assets/
          (cd release-assets && sha256sum -- *) > hashes/arch.sha256
          cat hashes/arch.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backroom-arch
          path: |
            release-assets/
            hashes/
          if-no-files-found: error
          retention-days: 14

  # packaging/aur/backroom/PKGBUILD (the from-source package) built end to end from this commit,
  # so a broken source package blocks the release. GitHub's tag tarball does not exist for a
  # dry run, so `git archive` makes the same layout (Backroom-<version>/) locally. Not uploaded:
  # the release ships only the backroom-bin package.
  arch-source:
    needs: version
    if: needs.version.outputs.prerelease != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    container:
      image: archlinux:base-devel-20261025.0.616225@sha256:624bdc7fc6615155d67bc34cf7146c0c9fd0e3c92943977da63a630e4ca49c30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # The keyring first: an image that is months old may not know the packagers' current keys.
      - name: Update the system and install git and namcap
        run: |
          set -euo pipefail
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Su --noconfirm
          pacman -S --noconfirm --needed git namcap

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the backroom build directory
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          build=/tmp/aur-source
          mkdir -p "$build"
          tarball="backroom-${VERSION}.tar.gz"
          git archive --prefix="Backroom-${VERSION}/" -o "$build/$tarball" HEAD
          sha="$(sha256sum "$build/$tarball" | cut -d' ' -f1)"
          sed -e "s/^pkgver=.*/pkgver=${VERSION}/" -e 's/^pkgrel=.*/pkgrel=1/' \
            -e "s/^sha256sums=(.*/sha256sums=('${sha}')/" packaging/aur/backroom/PKGBUILD > "$build/PKGBUILD"
          diff packaging/aur/backroom/PKGBUILD "$build/PKGBUILD" || true
          useradd --create-home builder
          chown -R builder: "$build"

      - name: Install the build and runtime dependencies
        working-directory: /tmp/aur-source
        run: |
          set -euo pipefail
          mapfile -t deps < <(runuser -u builder -- makepkg --printsrcinfo | sed -n 's/^\t\(make\)\?depends = //p')
          pacman -S --noconfirm --needed "${deps[@]}"

      - name: Build backroom from source
        working-directory: /tmp/aur-source
        run: runuser -u builder -- makepkg --noconfirm

      - name: namcap
        working-directory: /tmp/aur-source
        run: |
          set -euo pipefail
          pkg="backroom-${VERSION}-1-x86_64.pkg.tar.zst"
          test -f "$pkg" || { echo "::error::makepkg did not produce $pkg"; ls -l; exit 1; }
          out="$(namcap "$pkg" 2>&1)"
          echo "$out"
          if grep -q ' E: ' <<< "$out"; then
            echo "::error::namcap reported errors"
            exit 1
          fi
          bsdtar -tf "$pkg" | grep -v '^\.'

  release:
    needs: [version, linux, windows, macos, arch, arch-source]
    # Only for a pushed v* tag; never for manual runs (dry run or not). The Arch jobs are skipped
    # for pre-releases, so `success()` alone would skip this job too: check each result instead.
    if: >-
      !cancelled()
      && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      && needs.version.result == 'success' && needs.linux.result == 'success'
      && needs.windows.result == 'success' && needs.macos.result == 'success'
      && ((needs.arch.result == 'success' && needs.arch-source.result == 'success')
          || (needs.version.outputs.prerelease == 'true'
              && needs.arch.result == 'skipped' && needs.arch-source.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Full history and tags, for the notes (commit subjects since the previous tag).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: backroom-*
          path: downloaded

      - name: Flatten and check the assets
        run: |
          set -euo pipefail
          expected=(
            "Backroom_${VERSION}_amd64.deb"
            "Backroom_${VERSION}_amd64.AppImage"
            "Backroom_${VERSION}_x64-setup.exe"
            "Backroom_${VERSION}_universal.dmg"
          )
          if [ "$PRERELEASE" != true ]; then
            expected+=(
              "Backroom-${VERSION}-1.x86_64.rpm"
              "Backroom_${VERSION}_x64_en-US.msi"
              "backroom-bin-${VERSION}-1-x86_64.pkg.tar.zst"
            )
          fi
          mkdir assets
          find downloaded -path '*/release-assets/*' -type f -exec mv -n {} assets/ \;
          # A file left behind means two artifacts carried the same name.
          if [ -n "$(find downloaded -path '*/release-assets/*' -type f)" ]; then
            echo "::error::duplicate asset names"
            find downloaded -path '*/release-assets/*' -type f
            exit 1
          fi
          for f in "${expected[@]}"; do
            test -f "assets/$f" || { echo "::error::missing asset $f"; ls -l assets; exit 1; }
          done
          count="$(find assets -type f | wc -l)"
          if [ "$count" -ne "${#expected[@]}" ]; then
            echo "::error::expected ${#expected[@]} assets, found $count"
            ls -l assets
            exit 1
          fi
          (cd assets && sha256sum -- "${expected[@]}" | LC_ALL=C sort -k2 > SHA256SUMS)
          cat assets/SHA256SUMS

      # The hashes each build job recorded right after building must equal what arrived here.
      # (Git Bash's sha256sum marks binary mode with `*`; normalise that to two spaces.)
      - name: Compare with the build jobs' hashes
        run: |
          set -euo pipefail
          find downloaded -path '*/hashes/*.sha256' -type f -exec cat {} + \
            | sed -E 's/^([0-9a-f]{64}) [ *]/\1  /' | LC_ALL=C sort -k2 > built.sha256
          if ! diff -u built.sha256 assets/SHA256SUMS; then
            echo "::error::the downloaded assets differ from the hashes the build jobs recorded"
            exit 1
          fi
          echo "build-job hashes match SHA256SUMS"

      # Commit subjects only. `@` gets a zero-width space after it so a subject cannot mention
      # (notify) a GitHub user or team; reviewers still read the notes before publishing.
      - name: Write the release notes
        run: |
          set -euo pipefail
          prev="$(git describe --tags --abbrev=0 --match 'v*.*.*' "${TAG}^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            range="${prev}..${TAG}"
            since="since ${prev}"
          else
            range="$TAG"
            since="(first release)"
          fi
          zwsp=$'\xe2\x80\x8b'
          {
            echo "Backroom ${VERSION}"
            echo
            echo "These installers are not code signed: Windows SmartScreen and macOS Gatekeeper"
            echo "will warn on first launch. See docs/RELEASING.md for what to expect."
            echo "Verify downloads with SHA256SUMS (sha256sum -c SHA256SUMS --ignore-missing)."
            if [ "$PRERELEASE" != true ]; then
              echo "Arch Linux: sudo pacman -U backroom-bin-${VERSION}-1-x86_64.pkg.tar.zst"
            fi
            echo
            echo "Changes ${since}:"
            git log --no-merges --pretty='format:- %s (%h)' "$range" | sed "s/@/@${zwsp}/g"
            echo
          } > notes.txt
          cat notes.txt

      # Lists releases through the API because drafts cannot be looked up by tag.
      - name: Refuse when a release for the tag already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh api "repos/${GH_REPO}/releases?per_page=100" --paginate \
            --jq '.[] | select(.tag_name == env.TAG) | .draft')"
          if [ -n "$existing" ]; then
            kinds="$(echo "$existing" | sed 's/^true$/draft/; s/^false$/published/' | paste -sd, -)"
            echo "::error::a release for ${TAG} already exists (${kinds}); delete it on GitHub first, then re-run this job"
            exit 1
          fi
          echo "no release exists for ${TAG}"

      # Draft only: never published, never marked latest by this workflow. `--verify-tag` refuses
      # to create a tag that does not exist on the remote.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(--draft --verify-tag --title "Backroom ${VERSION}" --notes-file notes.txt)
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          mapfile -t files < <(sed 's|^[0-9a-f]*  |assets/|' assets/SHA256SUMS)
          gh release create "$TAG" "${args[@]}" "${files[@]}" assets/SHA256SUMS

      # Downloads every asset of the new draft through the API (by release id, which works for
      # drafts) and checks it against SHA256SUMS, so a corrupted upload fails the run.
      - name: Verify the uploaded assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t ids < <(gh api "repos/${GH_REPO}/releases?per_page=100" --paginate \
            --jq '.[] | select(.tag_name == env.TAG) | .id')
          if [ "${#ids[@]}" -ne 1 ]; then
            echo "::error::expected exactly one release for ${TAG}, found ${#ids[@]}"
            exit 1
          fi
          mkdir verify
          gh api "repos/${GH_REPO}/releases/${ids[0]}/assets?per_page=100" --paginate \
            --jq '.[] | [.id, .name] | @tsv' > verify-list.tsv
          while IFS=$'\t' read -r asset_id name; do
            if ! [[ "$asset_id" =~ ^[0-9]+$ && "$name" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::unexpected asset entry"
              exit 1
            fi
            gh api -H 'Accept: application/octet-stream' "repos/${GH_REPO}/releases/assets/${asset_id}" > "verify/${name}"
          done < verify-list.tsv
          want=$(( $(wc -l < assets/SHA256SUMS) + 1 ))
          got="$(find verify -type f | wc -l)"
          if [ "$got" -ne "$want" ]; then
            echo "::error::the draft has ${got} assets, expected ${want}"
            exit 1
          fi
          cmp verify/SHA256SUMS assets/SHA256SUMS
          (cd verify && sha256sum -c SHA256SUMS)

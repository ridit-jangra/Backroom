name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Runs the root postinstall (emoji asset generation) that the web, worker and server tests need.
      - run: npm ci

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev

      # dtolnay/rust-toolchain has no release tags. Pinned to a master commit: the `stable` branch
      # is rebuilt on every master update, so an old `stable` SHA is not reachable from any branch.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16 (Add 1.99.1 patch release)
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri

      - name: Unit tests (all workspaces, including apps/server and cargo test)
        run: npm test

      - name: Type-check web
        run: npx tsc -p apps/web

      - name: Type-check worker
        run: npx tsc -p apps/worker

      - name: Type-check server
        run: npx tsc -p apps/server

      - name: Clippy (desktop)
        working-directory: apps/desktop/src-tauri
        run: cargo clippy -- -D warnings

  e2e:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # CI=true (set by GitHub Actions) selects the bundled chromium. No secrets are used: global setup
      # builds the web app and the server bundle into e2e/.tmp, then starts the Node server
      # (node e2e/.tmp/server/server.mjs) on 127.0.0.1:8788 with RESEND_API_KEY=dev (console mailer).
      - name: Playwright suite
        run: npm run e2e

      - name: Upload Playwright traces and server log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure
          path: |
            e2e/.tmp/test-results
            e2e/.tmp/server.log
          if-no-files-found: ignore
          retention-days: 7
